name: Lint

on:
    push:
        branches: [main, development]
    pull_request:
        branches: [main, development]

jobs:
    lint:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Run ESLint
              run: npm run lint

            - name: Check Prettier formatting
              run: npm run format:check

            - name: Run test suites
              run: |
                  npm test

    # The Firestore security rules only run under the emulator, which needs Java 21+.
    # Keeping that here means nobody has to install a JDK to know the rules still hold.
    rules:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: 'npm'

            - name: Set up Java 21 for the Firestore emulator
              uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: '21'

            - name: Install dependencies
              run: npm ci

            # The emulator jar and firebase-tools are the slow part of this job, so they
            # are cached against package.json (which pins firebase-tools@15).
            - name: Cache the Firestore emulator
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cache/firebase/emulators
                      ~/.npm/_npx
                  key: firebase-emulators-${{ runner.os }}-${{ hashFiles('package.json', 'firebase.json') }}
                  restore-keys: |
                      firebase-emulators-${{ runner.os }}-

            - name: Run security rules tests
              run: npm run test:rules
