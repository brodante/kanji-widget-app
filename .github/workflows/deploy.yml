name: Deploy to GitHub Pages

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: 'pages'
    cancel-in-progress: false

jobs:
    deploy:
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up Node
              uses: actions/setup-node@v4
              with:
                  node-version: '20'

            - name: Create deployment directory
              run: |
                  mkdir -p deploy
                  # Copy only necessary files for static hosting
                  cp index.html deploy/
                  cp CNAME deploy/
                  cp styles.css deploy/
                  cp script.js deploy/
                  cp analytics.js deploy/
                  cp drawing-pad.js deploy/
                  cp -r assets deploy/
                  # Only the level files are fetched at runtime (kanji-data.js loads
                  # database/{level}.json and 'all' merges N5-N1 in code). The 1.8 MB
                  # complete_kanji_db.json, vocab.json and sort-json.py are source
                  # material for the tools/ scripts and stay out of the Pages artifact.
                  mkdir -p deploy/database
                  cp database/Hiragana.json database/Katakana.json deploy/database/
                  cp database/N1.json database/N2.json database/N3.json database/N4.json database/N5.json deploy/database/
                  cp backup-config.js deploy/
                  cp firebase-config.js deploy/
                  cp username-policy.js deploy/
                  cp app-auth.js deploy/
                  cp username-directory.js deploy/
                  cp auth-dialog.js deploy/
                  cp cloud-sync.js deploy/
                  cp ui-feedback.js deploy/
                  cp backup-manager.js deploy/
                  cp profile-page.js deploy/
                  cp avatar-crop.js deploy/
                  cp kanji-data.js deploy/
                  cp audio-manager.js deploy/
                  cp ai-manager.js deploy/
                  cp ai-tutor-modal.js deploy/
                  cp srs-engine.js deploy/
                  cp storage-manager.js deploy/
                  cp manifest.json deploy/
                  # The manifest's large icons point at this file (data-URI icons are
                  # rejected by Chrome and log a console error on every load)
                  if [ -f "icon.svg" ]; then cp icon.svg deploy/; fi
                  # Favicon is optional: skip the copy instead of failing the deploy
                  if [ -f "favicon.gif" ]; then cp favicon.gif deploy/; fi
                  # Social share card. The og:image URL is https://kanji.qd.je/preview.png;
                  # the source lives under assets/social so the repo root keeps the
                  # README's preview.PNG untouched.
                  mv deploy/assets/social/preview-card.png deploy/preview.png
                  rmdir deploy/assets/social
                  # Dead weight: referenced nowhere in the shipped app.
                  rm -f deploy/assets/icons/clover-badge.png
                  cp sw.js deploy/
                  # Copy docs if they exist (the app links docs/google-drive-backup.md)
                  if [ -d "docs" ]; then cp -r docs deploy/; fi

            # Minify first-party JS/CSS in place (same filenames, so index.html and the
            # service worker precache list need no rewriting). See tools/minify.js.
            - name: Install dev dependencies (minifier)
              run: npm ci --no-audit --no-fund

            - name: Minify assets
              run: |
                  node tools/minify.js deploy
                  # Minified output is always smaller than its source. If a deploy/ file is not
                  # smaller, the step above did not actually run and we must not ship it
                  # silently (this has already happened once). Line counts are useless here:
                  # esbuild preserves the newlines inside the app's multi-line HTML templates,
                  # so a correctly minified script.js is still hundreds of lines long.
                  # index.html is minified too now (comments + inter-tag whitespace,
                  # roughly -55%), with the same source-vs-output byte guard.
                  for f in script.js styles.css kanji-data.js index.html; do
                      src=$(wc -c < "$f")
                      out=$(wc -c < "deploy/$f")
                      if [ "$out" -ge "$src" ]; then
                          echo "::error::deploy/$f is $out bytes, not smaller than the $src byte source - minification did not run"
                          exit 1
                      fi
                  done

            - name: Setup Pages
              uses: actions/configure-pages@v4

            - name: Upload artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: './deploy'

            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4

            # The byte guard above only sees deploy/. A Pages misconfiguration once shipped
            # the unminified branch files while every step here stayed green, so verify what
            # the live site actually serves. The custom domain picks up a fresh deployment
            # within a couple of minutes; poll instead of assuming the first response.
            - name: Verify the live site serves the minified artifact
              run: |
                  LIVE="https://kanji.qd.je"
                  live_size() {
                      curl -fsSL --compressed "$LIVE/$1" | wc -c
                  }
                  # Minified today: script.js 83,121 B, styles.css 108,654 B.
                  # Unminified: 168,077 B and 174,921 B. The thresholds sit between.
                  ok=false
                  for attempt in 1 2 3 4 5 6 7 8; do
                      script_bytes=$(live_size "script.js?v=ai-floating-v1")
                      style_bytes=$(live_size "styles.css?v=custom-footer-glass-v1")
                      if [ "$script_bytes" -gt 0 ] && [ "$script_bytes" -lt 120000 ] \
                         && [ "$style_bytes" -gt 0 ] && [ "$style_bytes" -lt 150000 ]; then
                          echo "live site serves the minified artifact (script.js ${script_bytes} B, styles.css ${style_bytes} B)"
                          ok=true
                          break
                      fi
                      echo "attempt $attempt: live assets still look unminified (script.js ${script_bytes} B, styles.css ${style_bytes} B); waiting 30 s"
                      sleep 30
                  done
                  if [ "$ok" != "true" ]; then
                      echo "::error::the live site still serves unminified assets after 4 minutes - check the Pages deployment for this commit"
                      exit 1
                  fi
